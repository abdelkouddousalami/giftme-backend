services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-giftme}
      POSTGRES_USER: ${DATABASE_USERNAME:-giftme}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-giftme} -d ${DATABASE_NAME:-giftme}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-giftme}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-giftme}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - generate with: openssl rand -base64 64}
      FILE_STORAGE_PATH: /app/storage/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://giftme.ma}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/storage/uploads

volumes:
  postgres_data:
  uploads_data:
