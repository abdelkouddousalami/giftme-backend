spring:
  datasource:
    url: jdbc:h2:mem:giftme_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

giftme:
  jwt:
    secret: test_only_secret_key_that_is_long_enough_for_hmac_sha256_signing
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 1209600000
  storage:
    local:
      base-path: ./build/test-uploads

logging:
  level:
    root: WARN
