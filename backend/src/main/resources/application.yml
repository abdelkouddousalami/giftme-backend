spring:
  application:
    name: giftme-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/giftme}
    username: ${DATABASE_USERNAME:giftme}
    password: ${DATABASE_PASSWORD:giftme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 60MB
      max-request-size: 60MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

giftme:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_this_is_a_dev_only_secret_key_min_256_bits_long_please_rotate}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}       # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000} # 14 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    provider: local
    local:
      base-path: ${FILE_STORAGE_PATH:./storage/uploads}
    public-base-url: ${FILE_STORAGE_PUBLIC_URL:/uploads}
    limits:
      image-max-bytes: 5242880   # 5MB
      video-max-bytes: 52428800  # 50MB
      audio-max-bytes: 20971520  # 20MB
  order:
    delivery-fee-default: 30.00
    delivery-fee-free-threshold: 500.00
  public-base-url: ${PUBLIC_APP_URL:https://giftme.ma}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.giftme: INFO
    org.hibernate.SQL: WARN
