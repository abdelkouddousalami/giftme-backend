<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` lets content draw under the notch/home-indicator
         on edge-to-edge phones; without it every env(safe-area-inset-*) below
         resolves to 0 and the padding it drives is a silent no-op. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)" />
    <title>GiftMe — Personalized gifts, made to mean more</title>
    <meta
      name="description"
      content="Personalized puzzles, mugs and gift sets, each one made to order. Add your names, your photo and a private QR memory of photos, video and voice — opened with one scan."
    />

    <!--
      Fraunces (editorial serif) + Inter (neutral grotesk) are the intended
      typefaces: warm and considered rather than romantic, and legible at the
      micro sizes the trust bar and product labels are set in.

      The stacks in src/styles/tokens.css fall back to system serif/sans with
      similar proportions, so the page stays correctly composed if these never
      load. To drop the external request, delete these three tags and self-host,
      or rely on the fallbacks alone.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@300..600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Applies a saved theme choice before first paint, so the page never
         flashes light-then-dark (or vice versa) on load. ThemeContext owns
         this same logic for everything after the initial render. -->
    <script>
      try {
        var theme = localStorage.getItem('giftme-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
