<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF7F3" />
    <title>GiftMe — More than a gift, a memory</title>
    <meta
      name="description"
      content="Personalized puzzles, mugs and QR memories. Add a private page of photos, video and voice to your gift, and let them discover it with one scan."
    />

    <!--
      Playfair Display + Poppins are the intended typefaces. The stack in
      src/styles/tokens.css falls back to system serif/sans, so the page stays
      readable and correctly proportioned if these never load.
      To drop the external request, delete these three tags and self-host, or
      rely on the fallbacks alone.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
